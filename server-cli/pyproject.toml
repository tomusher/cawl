[project]
name = "cawl-server"
version = "0.1.1"
description = "Operator CLI for provisioning and updating cawl control planes"
requires-python = ">=3.11"

[project.scripts]
cawl-server = "cawl_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cawl_server = ["data/deploy/**"]
