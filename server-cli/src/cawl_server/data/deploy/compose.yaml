services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cawl
      POSTGRES_USER: cawl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cawl -d cawl"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cawl:
    image: ghcr.io/tomusher/cawl-server:main
    env_file: .env
    environment:
      CAWL_DATABASE_URL: postgresql://cawl:${POSTGRES_PASSWORD}@postgres:5432/cawl
      CAWL_INGRESS_DIR: /var/lib/cawl/dynamic
      CAWL_DAEMON_URL: http://cawl:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - traefik-dynamic:/var/lib/cawl/dynamic
      # Put the Incus client.crt, client.key, and server.crt in this directory.
      - ./secrets/incus:/run/secrets/incus:ro
      # The SSH CA is optional, but required for `cawl ssh`.
      - ./secrets/ssh_ca:/run/secrets/ssh_ca:ro
      - ./secrets/ssh_ca.pub:/run/secrets/ssh_ca.pub:ro
    restart: unless-stopped

  reaper:
    image: ghcr.io/tomusher/cawl-server:main
    env_file: .env
    environment:
      CAWL_DATABASE_URL: postgresql://cawl:${POSTGRES_PASSWORD}@postgres:5432/cawl
      CAWL_INGRESS_DIR: /var/lib/cawl/dynamic
      CAWL_DAEMON_URL: http://cawl:8000
    command: ["/bin/sh", "-c", "while true; do python manage.py reap; sleep 60; done"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - traefik-dynamic:/var/lib/cawl/dynamic
      - ./secrets/incus:/run/secrets/incus:ro
      - ./secrets/ssh_ca:/run/secrets/ssh_ca:ro
    restart: unless-stopped

  # The dynamic-routes volume is mounted read-only by Traefik. Populate the
  # static control-plane route in that volume before Traefik starts rather than
  # attempting a nested bind mount inside the read-only volume.
  traefik-config:
    image: alpine:3.21
    command: ["/bin/sh", "-c", "cp /source/control-plane.yml /dynamic/control-plane.yml"]
    volumes:
      - traefik-dynamic:/dynamic
      - ./traefik/control-plane.yml:/source/control-plane.yml:ro
    restart: "no"

  traefik:
    image: traefik:v3.7
    command: ["--configFile=/etc/traefik/traefik.yml"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    depends_on:
      cawl:
        condition: service_started
      traefik-config:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  traefik-dynamic:
  traefik-acme:
