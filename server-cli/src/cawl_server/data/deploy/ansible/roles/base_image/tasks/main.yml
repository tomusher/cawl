---
- name: Check for the cawl base image matching the selected runtime
  ansible.builtin.command: >-
    incus image list
    {{ 'cawl/base-vm' if (cawl_base_image_vm | bool) else 'cawl/base' }}
    --format json
  register: cawl_base_image
  changed_when: false

- name: Build the cawl VM base image when absent
  ansible.builtin.command: ./build-base-image.sh --vm
  args:
    chdir: "{{ cawl_deploy_dir }}"
  when:
    - cawl_base_image_vm | bool
    - (cawl_base_image.stdout | from_json | length) == 0

- name: Build the cawl container base image when absent
  ansible.builtin.command: ./build-base-image.sh
  args:
    chdir: "{{ cawl_deploy_dir }}"
  when:
    - not (cawl_base_image_vm | bool)
    - (cawl_base_image.stdout | from_json | length) == 0
