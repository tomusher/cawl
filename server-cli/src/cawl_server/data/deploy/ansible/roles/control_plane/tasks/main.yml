---
- name: Install control-plane dependencies
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - openssl
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create deployment directory
  ansible.builtin.file:
    path: "{{ cawl_deploy_dir }}"
    state: directory
    mode: "0750"

- name: Copy bundled deployment files
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../{{ item }}"
    dest: "{{ cawl_deploy_dir }}/{{ item }}"
    mode: "{{ '0755' if item == 'build-base-image.sh' else omit }}"
  loop:
    - build-base-image.sh
    - compose.yaml
    - .env.example

- name: Copy bundled Traefik configuration
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../traefik/"
    dest: "{{ cawl_deploy_dir }}/traefik/"

- name: Pin the server image tag selected by the operator
  ansible.builtin.replace:
    path: "{{ cawl_deploy_dir }}/compose.yaml"
    regexp: 'ghcr.io/tomusher/cawl-server:[^"\s]+'
    replace: "ghcr.io/tomusher/cawl-server:{{ cawl_server_image_tag }}"
  when: cawl_server_image_tag is defined

- name: Check for an existing deployment environment file
  ansible.builtin.stat:
    path: "{{ cawl_deploy_dir }}/.env"
  register: cawl_env_file

- name: Seed the deployment environment file
  ansible.builtin.copy:
    src: "{{ cawl_deploy_dir }}/.env.example"
    dest: "{{ cawl_deploy_dir }}/.env"
    remote_src: true
    mode: "0600"
  when: not cawl_env_file.stat.exists

- name: Create deployment secret directories
  ansible.builtin.file:
    path: "{{ cawl_deploy_dir }}/{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - secrets/incus
    - secrets/ssh_ca

- name: Write operator-supplied deployment settings
  ansible.builtin.lineinfile:
    path: "{{ cawl_deploy_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    mode: "0600"
  loop: "{{ cawl_env | dict2items }}"
  no_log: true

- name: Configure local Incus certificate paths
  ansible.builtin.lineinfile:
    path: "{{ cawl_deploy_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    mode: "0600"
  loop:
    - { key: CAWL_RUNTIME, value: incus_api }
    - { key: CAWL_INCUS_CLIENT_CERT, value: /run/secrets/incus/client.crt }
    - { key: CAWL_INCUS_CLIENT_KEY, value: /run/secrets/incus/client.key }
    - { key: CAWL_INCUS_SERVER_CERT, value: /run/secrets/incus/server.crt }
  when:
    - cawl_configure_incus_trust | default(true)
    - inventory_hostname in groups['incus']

- name: Check whether deployment secrets already exist
  ansible.builtin.shell: >-
    grep -Pq '^POSTGRES_PASSWORD=(?!replace-with-).+' .env &&
    grep -Pq '^CAWL_SECRET_KEY=(?!replace-with-).+' .env
  args:
    chdir: "{{ cawl_deploy_dir }}"
    executable: /bin/bash
  register: cawl_secrets_exist
  changed_when: false
  failed_when: false
  no_log: true

- name: Generate deployment secrets once
  ansible.builtin.shell: |
    set -eu
    sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 32)|" .env
    sed -i "s|^CAWL_SECRET_KEY=.*|CAWL_SECRET_KEY=$(openssl rand -hex 32)|" .env
  args:
    chdir: "{{ cawl_deploy_dir }}"
    executable: /bin/bash
  when: cawl_secrets_exist.rc != 0
  no_log: true

- name: Mark the noninteractive deployment configuration complete
  ansible.builtin.lineinfile:
    path: "{{ cawl_deploy_dir }}/.env"
    regexp: '^CAWL_BOOTSTRAPPED='
    line: CAWL_BOOTSTRAPPED=1
    mode: "0600"

- name: Render Traefik static configuration
  ansible.builtin.template:
    src: "{{ role_path }}/../../../traefik/traefik.yml.template"
    dest: "{{ cawl_deploy_dir }}/traefik/traefik.yml"
    mode: "0644"

- name: Start Postgres
  ansible.builtin.command: docker compose up -d postgres
  args:
    chdir: "{{ cawl_deploy_dir }}"

- name: Wait for Postgres
  ansible.builtin.command: docker compose exec -T postgres pg_isready -U cawl -d cawl
  args:
    chdir: "{{ cawl_deploy_dir }}"
  register: cawl_postgres_ready
  changed_when: false
  retries: 12
  delay: 5
  until: cawl_postgres_ready.rc == 0

- name: Apply database migrations
  ansible.builtin.command: docker compose run --rm cawl python manage.py migrate --noinput
  args:
    chdir: "{{ cawl_deploy_dir }}"

- name: Start the Compose deployment
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ cawl_deploy_dir }}"

- name: Regenerate sandbox ingress routes
  ansible.builtin.command: docker compose exec -T cawl python manage.py sync_ingress
  args:
    chdir: "{{ cawl_deploy_dir }}"
