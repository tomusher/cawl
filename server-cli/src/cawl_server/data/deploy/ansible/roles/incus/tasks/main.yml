---
- name: Require a Debian-family host for managed Incus
  ansible.builtin.assert:
    that: ansible_os_family == 'Debian'
    fail_msg: >-
      Managed Incus installation currently supports Debian/Ubuntu hosts. Set
      cawl_incus_mode: existing and install Incus yourself on other systems.
  when: cawl_incus_mode == 'managed'

- name: Install repository prerequisites for managed Incus
  ansible.builtin.apt:
    name:
      - ca-certificates
      - qemu-system
      - openssl
    state: present
    update_cache: true
  when: cawl_incus_mode == 'managed'

- name: Create the Incus repository keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: cawl_incus_mode == 'managed'

- name: Install the official Incus repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.zabbly.com/key.asc
    dest: /etc/apt/keyrings/zabbly-incus.asc
    mode: "0644"
  when: cawl_incus_mode == 'managed'

- name: Configure the official Incus package repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/zabbly-incus.sources
    mode: "0644"
    content: |
      Enabled: yes
      Types: deb
      URIs: https://pkgs.zabbly.com/incus/{{ cawl_incus_channel | default('stable') }}
      Suites: {{ ansible_distribution_release }}
      Components: main
      Signed-By: /etc/apt/keyrings/zabbly-incus.asc
  when: cawl_incus_mode == 'managed'

- name: Install Incus from the official repository
  ansible.builtin.apt:
    name: incus
    state: present
    update_cache: true
  when: cawl_incus_mode == 'managed'

- name: Initialise Incus with a reviewed preseed
  ansible.builtin.command: incus admin init --preseed
  args:
    stdin: "{{ cawl_incus_preseed }}"
    creates: /var/lib/incus/database
  when:
    - cawl_incus_mode == 'managed'
    - cawl_incus_preseed | length > 0

- name: Initialise Incus with its safe defaults
  ansible.builtin.command: incus admin init --auto
  args:
    creates: /var/lib/incus/database
  when:
    - cawl_incus_mode == 'managed'
    - cawl_incus_preseed | length == 0

- name: Expose the local Incus HTTPS API to the control-plane containers
  ansible.builtin.command: incus config set core.https_address :8443
  changed_when: false
  when:
    - inventory_hostname in groups['control_plane']
    - cawl_incus_mode == 'managed' or cawl_configure_incus_trust | default(true)

- name: Create the local control-plane Incus credential directory
  ansible.builtin.file:
    path: "{{ cawl_deploy_dir }}/secrets/incus"
    state: directory
    owner: "{{ cawl_container_uid | default(10001) }}"
    group: "{{ cawl_container_gid | default(10001) }}"
    mode: "0700"
  when:
    - cawl_configure_incus_trust | default(true)
    - inventory_hostname in groups['control_plane']

- name: Generate the local control-plane Incus client certificate
  ansible.builtin.command: >-
    openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 -nodes
    -keyout {{ cawl_deploy_dir }}/secrets/incus/client.key
    -out {{ cawl_deploy_dir }}/secrets/incus/client.crt -days 3650
    -subj /CN={{ cawl_incus_trust_name | default('cawl-server') }}
  args:
    creates: "{{ cawl_deploy_dir }}/secrets/incus/client.key"
  when:
    - cawl_configure_incus_trust | default(true)
    - inventory_hostname in groups['control_plane']

- name: Restrict the local Incus client private key
  ansible.builtin.file:
    path: "{{ cawl_deploy_dir }}/secrets/incus/client.key"
    owner: "{{ cawl_container_uid | default(10001) }}"
    group: "{{ cawl_container_gid | default(10001) }}"
    mode: "0600"
  when:
    - cawl_configure_incus_trust | default(true)
    - inventory_hostname in groups['control_plane']

- name: Trust the local control-plane client certificate in Incus
  ansible.builtin.command: >-
    incus config trust add-certificate
    {{ cawl_deploy_dir }}/secrets/incus/client.crt
    --name {{ cawl_incus_trust_name | default('cawl-server') }}
  register: cawl_incus_trust
  changed_when: cawl_incus_trust.rc == 0
  failed_when: >-
    cawl_incus_trust.rc != 0 and
    'already exists' not in cawl_incus_trust.stderr | lower and
    'already in trust store' not in cawl_incus_trust.stderr | lower
  when:
    - cawl_configure_incus_trust | default(true)
    - inventory_hostname in groups['control_plane']

- name: Pin the local Incus server certificate for the control plane
  ansible.builtin.copy:
    src: /var/lib/incus/server.crt
    dest: "{{ cawl_deploy_dir }}/secrets/incus/server.crt"
    remote_src: true
    owner: "{{ cawl_container_uid | default(10001) }}"
    group: "{{ cawl_container_gid | default(10001) }}"
    mode: "0644"
  when:
    - cawl_configure_incus_trust | default(true)
    - inventory_hostname in groups['control_plane']

- name: Check that the Incus API is available
  ansible.builtin.command: incus query /1.0
  changed_when: false

- name: Read the Incus server version
  ansible.builtin.shell: "incus version | awk -F': ' '/^Server version:/ {print $2}'"
  register: cawl_incus_server_version
  changed_when: false

- name: Require a supported Incus server version
  ansible.builtin.assert:
    that:
      - cawl_incus_server_version.stdout | length > 0
      - cawl_incus_server_version.stdout is version(cawl_incus_min_version | default('6.0'), '>=')
    fail_msg: >-
      Incus server version {{ cawl_incus_server_version.stdout | default('unknown') }}
      is unsupported; cawl requires {{ cawl_incus_min_version | default('6.0') }} or newer.

- name: Check hardware virtualisation when building VM images
  ansible.builtin.stat:
    path: /dev/kvm
  register: cawl_kvm
  when: cawl_base_image_vm | bool

- name: Require KVM for VM images
  ansible.builtin.assert:
    that: cawl_kvm.stat.exists
    fail_msg: /dev/kvm is required to build and run cawl VM images.
  when: cawl_base_image_vm | bool
