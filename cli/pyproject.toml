[project]
name = "cawl"
version = "0.1.1"
description = "cawl — remote CLI + client for the sandbox control-plane daemon"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4",
]

[project.scripts]
cawl = "cawl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
