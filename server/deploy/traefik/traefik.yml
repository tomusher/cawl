# Cawl writes one route per exposure into the file-provider directory.
# Values below are expanded by Traefik from compose's .env file.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: le
        domains:
          - main: "${CAWL_BASE_DOMAIN}"
            sans:
              - "*.${CAWL_BASE_DOMAIN}"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      email: "${TRAEFIK_ACME_EMAIL}"
      storage: /acme/acme.json
      dnsChallenge:
        provider: "${TRAEFIK_DNS_PROVIDER}"

log:
  level: INFO
accessLog: {}
api:
  dashboard: false
