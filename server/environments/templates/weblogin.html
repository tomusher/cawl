<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — cawl</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center;
           min-height: 100vh; margin: 0; background: #f6f7f9; color: #1a1c1f; }
    main { background: #fff; border: 1px solid #e2e5e9; border-radius: 10px;
           padding: 2rem 2.5rem; max-width: 24rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
    p { color: #555b63; font-size: .9rem; line-height: 1.45; }
    input[type=email] { width: 100%; box-sizing: border-box; padding: .55rem .7rem;
           border: 1px solid #c9ced4; border-radius: 6px; font-size: 1rem; margin: .75rem 0; }
    button { width: 100%; padding: .6rem; border: 0; border-radius: 6px;
           background: #1f6feb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1a5fd0; }
  </style>
</head>
<body>
<main>
  <h1>Sign in to view this environment</h1>
  <p>Enter your email address. If it has access, we'll send you a sign-in
     link — no password needed.</p>
  <form method="post" action="/auth/login">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <input type="email" name="email" placeholder="you@example.com" required autofocus>
    <button type="submit">Email me a sign-in link</button>
  </form>
</main>
</body>
</html>
