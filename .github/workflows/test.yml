name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests
      - run: uv run python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: cawlserver.settings
          CAWL_RUNTIME: fake
          CAWL_SECRET_KEY: cawl-ci-test-secret-key-not-for-production
          CAWL_ALLOWED_HOSTS: "*"

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests
