[project]
site_name = "cawl"
site_description = "Ephemeral environments for whenever your team needs them: dev boxes, review links, and agent boxes from one server."
copyright = "&copy; 2026 the cawl authors"

nav = [
    { "Overview" = "index.md" },
    { "Using cawl" = [
        { "Quick Start" = "quick-start.md" },
        { "Usage" = "usage.md" },
        { "CLI" = "cli.md" },
    ] },
    { "Administration" = [
        { "Setting It Up" = "setup.md" },
        { "Incus VMs and agent egress" = "incus.md" },
        { "Templates" = "templates.md" },
        { "Extending" = "extending.md" },
    ] },
]

[project.theme]
language = "en"

features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
